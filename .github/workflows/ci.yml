# Builds GitHr and runs every test suite on Windows, Linux and macOS (also called by release.yml before packaging).
# Test reports, UI screenshots and (on Linux) code coverage are uploaded as artifacts
# and summarized on the run's summary page.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call: # the release workflow runs the full test matrix first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # always see all three platforms
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
            coverage: true
          - os: macos-latest
            name: macOS
    env:
      # UI tests save rendered frames here (see tests/GitHr.App.Tests/UiTestBase.cs).
      GITHR_TEST_ARTIFACTS: ${{ github.workspace }}/TestResults/screenshots
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The integration tests commit into throwaway repositories and need an identity.
      - name: Configure git for tests
        run: |
          git config --global user.name "GitHr CI"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global init.defaultBranch main
          git --version

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Core tests (unit + integration)
        run: >
          dotnet test --project tests/GitHr.Core.Tests -c Release --no-build
          --results-directory TestResults/core
          --report-xunit-html --report-xunit-html-filename core.html
          --report-xunit-markdown --report-xunit-markdown-filename core.md
          ${{ matrix.coverage && '--coverlet --coverlet-output-format cobertura' || '' }}

      - name: App tests (headless UI)
        if: success() || failure()
        run: >
          dotnet test --project tests/GitHr.App.Tests -c Release --no-build
          --results-directory TestResults/app
          --report-xunit-html --report-xunit-html-filename app.html
          --report-xunit-markdown --report-xunit-markdown-filename app.md

      # Plain POSIX shell + awk only: macOS runners ship bash 3.2.
      - name: Summary
        if: always()
        run: sh .github/scripts/test-summary.sh "${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
